name: Validate and deploy production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: PHP and JavaScript checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP 8.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          coverage: none

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run PHP checks
        run: bash tools/ci_php_checks.sh

      - name: Run JavaScript checks
        run: bash tools/ci_js_checks.sh

  deploy:
    name: Deploy tested commit
    needs:
      - validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out full repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          for secret_name in SERVER_HOST SERVER_PORT SERVER_USER SERVER_SSH_KEY; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: ${secret_name}"
              exit 1
            fi
          done
          if ! ssh-keygen -F "$SERVER_HOST" -f .github/known_hosts >/dev/null; then
            echo "::error::SERVER_HOST is not present in .github/known_hosts"
            exit 1
          fi

      - name: Build and transfer verified Git bundle
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/artdon-deploy-key"
          bundle_path="$RUNNER_TEMP/artdon-${GITHUB_SHA}.bundle"
          remote_bundle="/tmp/artdon-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          ssh_error="$RUNNER_TEMP/artdon-ssh-error"

          umask 077
          trap 'rm -f "$key_path" "$bundle_path" "$ssh_error"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$key_path"

          if ! ssh-keygen -y -f "$key_path" >/dev/null 2>&1; then
            echo "::error title=Invalid SERVER_SSH_KEY::The deployment secret is not a readable OpenSSH private key."
            exit 1
          fi
          deployment_public_key="$(ssh-keygen -y -f "$key_path")"
          deployment_fingerprint="$(printf '%s\n' "$deployment_public_key" | ssh-keygen -lf - | awk '{print $2}')"

          if ! ssh \
            -i "$key_path" \
            -p "$SERVER_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=.github/known_hosts \
            "${SERVER_USER}@${SERVER_HOST}" \
            true 2>"$ssh_error"; then
            ssh_message="$(tail -n 1 "$ssh_error")"
            echo "::error title=SSH preflight failed::${ssh_message} Deployment key fingerprint: ${deployment_fingerprint}"
            echo "::notice title=Deployment public key::${deployment_public_key}"
            exit 1
          fi

          git bundle create "$bundle_path" HEAD
          bundle_sha="$(sha256sum "$bundle_path" | awk '{print $1}')"

          if ! scp \
            -i "$key_path" \
            -P "$SERVER_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=.github/known_hosts \
            "$bundle_path" \
            "${SERVER_USER}@${SERVER_HOST}:${remote_bundle}" 2>"$ssh_error"; then
            scp_message="$(tail -n 1 "$ssh_error")"
            echo "::error title=Git bundle transfer failed::${scp_message}"
            exit 1
          fi

          ssh \
            -i "$key_path" \
            -p "$SERVER_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=.github/known_hosts \
            "${SERVER_USER}@${SERVER_HOST}" \
            bash -s -- "$GITHUB_SHA" "$bundle_sha" "$remote_bundle" <<'REMOTE'
          set -euo pipefail
          expected_commit="$1"
          expected_sha="$2"
          bundle_file="$3"
          repository="/www/wwwroot/Artdon/artdon_erp"

          trap 'rm -f "$bundle_file"' EXIT
          cd "$repository"

          # 工作区只要有未提交改动就停止。不备份、不丢弃，避免再次清掉未入库的门户入口或原型目录。
          dirty_status="$(git status --short)"
          if [ -n "$dirty_status" ]; then
            echo "Server worktree is dirty. Aborting deploy without changing local files." >&2
            printf '%s\n' "$dirty_status" >&2
            exit 1
          fi

          printf '%s  %s\n' "$expected_sha" "$bundle_file" | sha256sum -c -
          git bundle verify "$bundle_file"
          # 不写入 refs/remotes/deploy/main。该引用的日志文件属主不同，追加会 Permission denied。
          git bundle unbundle "$bundle_file" >/dev/null
          git cat-file -e "${expected_commit}^{commit}"

          # HEAD 日志文件属主不是部署用户，快进时无法追加。目录可写就删掉日志，让本次重建。
          for logf in .git/logs/HEAD .git/logs/refs/heads/main .git/logs/refs/remotes/origin/main .git/logs/refs/remotes/deploy/main; do
            if [ -e "$logf" ] && [ ! -w "$logf" ]; then
              rm -f "$logf" || { echo "Cannot remove unwritable reflog $logf" >&2; ls -l "$logf" >&2 || true; exit 1; }
            fi
          done

          git merge --ff-only "$expected_commit"

          if [ "$(git rev-parse HEAD)" != "$expected_commit" ]; then
            echo "Server HEAD does not match the tested commit." >&2
            exit 1
          fi

          if ! grep -F -q 'promotion_center_v1/prototype/' index.php; then
            echo "index.php does not contain promotion_center_v1/prototype/." >&2
            exit 1
          fi
          mapfile -t promotion_entries < <(grep -F "['key' => 'promotion'" index.php || true)
          if [ "${#promotion_entries[@]}" -lt 2 ]; then
            echo "index.php is missing the two promotion portal entries." >&2
            exit 1
          fi
          for entry in "${promotion_entries[@]}"; do
            case "$entry" in
              *promotion_center_v1/prototype/*) ;;
              *)
                echo "Promotion portal entry does not open promotion_center_v1/prototype/." >&2
                printf '%s\n' "$entry" >&2
                exit 1
                ;;
            esac
            case "$entry" in
              *"href' => 'promotion.php'"*)
                echo "Promotion portal entry still points at promotion.php." >&2
                printf '%s\n' "$entry" >&2
                exit 1
                ;;
            esac
          done

          if ! git -c core.logAllRefUpdates=false update-ref refs/remotes/origin/main "$expected_commit"; then
            echo "Could not update refs/remotes/origin/main; server HEAD is still the tested commit." >&2
          fi

          PHP_BIN=/www/server/php/80/bin/php bash tools/ci_php_checks.sh
          REMOTE

      - name: Verify public login route
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            --output /dev/null \
            https://novlight.com/artdon_erp/
